# Render Blueprint for the Octopus tariff dashboard in octopus-dashboard/.
# In Render: New → Blueprint, pick this repository, then Apply.
#
# This runs the shared version: visitors connect their own Octopus account in their browser, and the
# server stores no keys. For a private version with your own account built in, add Octopus__ApiKey,
# Octopus__AccountNumber and Dashboard__AccessCode in the service's Environment tab.
services:
  - type: web
    name: tariff-compare
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./octopus-dashboard
    dockerfilePath: ./octopus-dashboard/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    # Only redeploy when the dashboard changes, not the rest of this repository.
    buildFilter:
      paths:
        - octopus-dashboard/**
    envVars:
      - key: Octopus__DefaultRegion
        value: C
